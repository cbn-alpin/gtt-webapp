name: Check source code

on:
  push:
    branches:
      - develop

jobs:
  run_tests:
    runs-on: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js v18
        uses: actions/setup-node@v6
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies with lockfile
        run: npm ci

      - name: Code formatting check (Prettier)
        run: npm run format:check

      - name: Building application
        run: npm run build

      - name: Static code analysis (ESLint)
        run: npm run lint

      - name: Runnning Unit tests
        run: npm run test

      # - name: E2E
      #  run: npm run e2e:ci
