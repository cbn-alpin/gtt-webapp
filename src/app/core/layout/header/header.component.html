<mat-toolbar class="header sticky-header">
  <div class="logo-cbna">
    <img
      src="assets/images/logos/cbna.png"
      alt="CBNA Logo"
    />
  </div>

  <button
    mat-icon-button
    (click)="toggleSidenav()"
    aria-label="Ouvrir le menu"
  >
    <mat-icon>menu</mat-icon>
  </button>

  <span class="title">{{ currentTitle }}</span>

  <app-user-menu class="user-menu"></app-user-menu>
</mat-toolbar>
